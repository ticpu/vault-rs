name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

    - name: Check
      run: cargo check --all-targets --message-format=short

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Format
      run: cargo fmt --all -- --check

    # The same gate the pre-commit hook runs, so a discard cannot reach master
    # through a push that skipped the hook.
    - name: Error discards
      run: ./scripts/check-error-discards.sh

    # The integration tests drive the built binary against a throwaway dev
    # server, so the runner needs the official one. Without it they fail rather
    # than skip, which is the point: a suite that quietly does not exercise the
    # server reads exactly like one that passed.
    - name: Install Vault CLI
      run: |
        set -euo pipefail
        version=$(curl -fsSL https://api.github.com/repos/hashicorp/vault/releases/latest | jq -r .tag_name | tr -d v)
        curl -fsSLo vault.zip "https://releases.hashicorp.com/vault/${version}/vault_${version}_linux_amd64.zip"
        unzip -q vault.zip vault
        sudo install -m0755 vault /usr/local/bin/vault
        vault version

    - name: Test
      run: cargo test --release

  # amd64 only: enough to catch a broken Containerfile or control file, without
  # paying for the second architecture on every push.
  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Build .deb
      run: make deb

    - name: Inspect .deb
      run: |
        dpkg-deb -I vault-rs_*_amd64.deb
        dpkg-deb -c vault-rs_*_amd64.deb
