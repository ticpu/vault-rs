name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    strategy:
      matrix:
        include:
        - runner: ubuntu-latest
          arch: amd64
        - runner: ubuntu-24.04-arm
          arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
    # Full history: the Makefile derives the package version from the tag.
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Build .deb
      run: make deb DEB_ARCH=${{ matrix.arch }}

    - name: Name the bare binary
      run: |
        version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "vault-rs") | .version')
        cp "target/dist/${{ matrix.arch }}/vault-rs" "vault-rs-$version-linux-${{ matrix.arch }}"

    - uses: actions/upload-artifact@v7
      with:
        name: vault-rs-${{ matrix.arch }}
        path: |
          *.deb
          vault-rs-*-linux-*
        if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: actions/download-artifact@v8
      with:
        path: assets
        merge-multiple: true

    - name: Check tag matches package version
      run: |
        version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "vault-rs") | .version')
        if [ "$GITHUB_REF_NAME" != "v$version" ]; then
          echo "tag $GITHUB_REF_NAME does not match vault-rs package version $version" >&2
          exit 1
        fi
        echo "VERSION=$version" >> "$GITHUB_ENV"

    - name: Source tarball and checksums
      run: |
        git archive --format=tar.gz \
          --prefix="vault-rs-$VERSION/" \
          -o "assets/vault-rs-$VERSION.tar.gz" "$GITHUB_REF_NAME"
        cd assets
        sha256sum vault-rs-* *.deb > SHA256SUMS

    # The annotated tag's message is the changelog the release process writes.
    # `contents:body` drops the subject line (already the title) and, on a signed
    # tag, the PGP block that `contents` would paste into the release notes.
    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          --title "$GITHUB_REF_NAME" \
          --notes "$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")" \
          assets/*
