[workspace]
members = ["crates/vault-session", "crates/vault-rs", "crates/test-confine"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
authors = ["Jérôme Poulin <jeromepoulin@gmail.com>"]
repository = "https://github.com/ticpu/vault-rs"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
tracing = "0.1"
wiremock = "0.6"
