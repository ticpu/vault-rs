[package]
name = "vault-rs"
version = "0.1.0"
edition = "2021"
authors = ["Jérôme Poulin <jeromepoulin@gmail.com>"]
description = "A secure Vault PKI management tool for sysadmins"
license = "GPL-3.0-only"

[[bin]]
name = "vault-rs"
path = "src/main.rs"

[dependencies]
# HTTP client
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"

# Certificate parsing
x509-parser = "0.18"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
humantime = "2"

# CLI framework
clap = { version = "4.4", features = ["derive", "env"] }
clap_complete = "4.4"

# Cryptography
aes-gcm = "0.11"
rand = "0.10"
sha2 = "0.11"

# System integration
dirs = "6"
rpassword = "7"
which = "8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# DNS resolution
hickory-resolver = "0.26"
ordermap = "1"
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "aws-lc-rs"] }
rustls-pki-types = "1"

[dev-dependencies]
wiremock = "0.6"
